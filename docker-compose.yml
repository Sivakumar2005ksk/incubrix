version: '3.8'

services:
  # IncuBrix Video Editing Engine Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - STORAGE_TYPE=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-outputs
      - STT_PROVIDER=mock
      - NLP_PROVIDER=deterministic
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src
      - ./fixtures:/app/fixtures

  # MinIO: S3-Compatible Local Storage (Integration Standard #1 & #7)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: incubrix_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

volumes:
  minio_data:
